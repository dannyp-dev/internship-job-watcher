name: Check for new internships

on:
  schedule:
    - cron: "0,14,28,42,56 10,17 * * *"
      timezone: "America/New_York"
    - cron: "10,24,38,52 11,18 * * *"
      timezone: "America/New_York"
    - cron: "6,20,34,48 12,19 * * *"
      timezone: "America/New_York"
    - cron: "2,16,30,44,58 13,20 * * *"
      timezone: "America/New_York"
    - cron: "12,26,40,54 14,21 * * *"
      timezone: "America/New_York"
    - cron: "8,22,36,50 15,22 * * *"
      timezone: "America/New_York"
    - cron: "4,18,32,46 16,23 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification instead of checking jobs"
        required: false
        default: false
        type: boolean

concurrency:
  group: internship-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the watcher
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send a test phone notification
        if: ${{ inputs.test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py --test-notification

      - name: Check job sources
        if: ${{ inputs.test_notification != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py

      - name: Save notification history
        if: ${{ always() && inputs.test_notification != true }}
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes to save."
            exit 0
          fi
          git config user.name "internship-watcher[bot]"
          git config user.email "internship-watcher[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Update internship watcher state"
          git push
