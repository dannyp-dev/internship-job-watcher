name: Check for new internships

on:
  schedule:
    # Low-frequency fallback if Cloudflare ever stops dispatching. The Python
    # time guard prevents delayed GitHub runs from notifying outside 10 AM-midnight ET.
    - cron: "8 */4 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification instead of checking jobs"
        required: false
        default: false
        type: boolean
      baseline_current:
        description: "Record all current matches without sending alerts"
        required: false
        default: false
        type: boolean

concurrency:
  group: internship-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the watcher
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send a test phone notification
        if: ${{ inputs.test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py --test-notification

      - name: Check job sources
        if: ${{ inputs.test_notification != true && inputs.baseline_current != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py

      - name: Baseline newly added sources
        if: ${{ inputs.baseline_current == true }}
        run: python job_watcher.py --baseline-current

      - name: Save notification history
        if: ${{ always() && inputs.test_notification != true }}
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes to save."
            exit 0
          fi
          git config user.name "internship-watcher[bot]"
          git config user.email "internship-watcher[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Update internship watcher state"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Failed to save notification history after 4 attempts."
              exit 1
            fi
            echo "State push failed; rebasing and retrying (attempt $((attempt + 1))/4)."
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
