name: Check for new internships

on:
  schedule:
    # 10:07 AM through 11:52 PM Eastern during EDT, every 15 minutes.
    # A single UTC expression is intentionally used for scheduler reliability.
    - cron: "7,22,37,52 0-3,14-23 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification instead of checking jobs"
        required: false
        default: false
        type: boolean

concurrency:
  group: internship-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the watcher
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send a test phone notification
        if: ${{ inputs.test_notification == true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py --test-notification

      - name: Check job sources
        if: ${{ inputs.test_notification != true }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_watcher.py

      - name: Save notification history
        if: ${{ always() && inputs.test_notification != true }}
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes to save."
            exit 0
          fi
          git config user.name "internship-watcher[bot]"
          git config user.email "internship-watcher[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Update internship watcher state"
          git push
